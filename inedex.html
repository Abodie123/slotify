function bookPay(id){const s=S.services.find(x=>x.id===id);if(!BS.date||!BS.time)return toast('Pick a day and a time first 📅');const fee=+(s.price*.1).toFixed(2),date=BS.date,time=BS.time;
 paySheet('💳 Pay Booking Fee',fee,`<div class="box">${esc(s.title)}<br>📅 ${esc(date)} · 🕒 ${t12(time)}<br>Booking fee: <b>GH₵${fee.toFixed(2)}</b> (10%)</div>`,async(tx,ph)=>{
  if(S.bookings.some(b=>b.serviceId===s.id&&b.date===date&&b.time===time&&['pending','confirmed'].includes(b.status)))return toast('Oops, that time was just taken. Pick another 🙏');
  const bid='bk_'+Date.now().toString(36)+rid(3);
  const p=save('bookings',bid,{uid:user.uid,bookingId:'',serviceId:s.id,serviceTitle:s.title,customerName:user.name,customerPhone:ph,price:s.price,bookingFee:fee,transactionId:tx,status:'pending',date,time,createdAt:Date.now()});
  addAlert(user.uid,'Payment pending','Payment pending - waiting for confirmation ('+s.title+')','payment');
  if(s.ownerUid)addAlert(s.ownerUid,'New booking request','New request for '+s.title+' on '+date+' at '+t12(time),'booking');
  shut();TAB='Upcoming';tab('bookings');toast('Booking sent! Waiting for confirmation ⏳');await p})}
async function setB(id,st){if(!confirm('Cancel this booking?'))return;const b=S.bookings.find(x=>x.id===id);if(!b)return;b.status=st;draw();await save('bookings',id,{status:st},1);mk();draw()}

/* ========== REVIEWS ========== */
function review(sid){const s=S.services.find(x=>x.id===sid);if(!s)return;
 if(!S.bookings.some(b=>b.uid===user.uid&&b.serviceId===sid&&['confirmed','completed'].includes(b.status)))return toast('Book this service first – then you can review it ⭐');
 const old=S.reviews.find(r=>r.id===user.uid+'_'+sid);STAR=old?old.rating:5;
 sheet(`<h3>✍️ Review: ${esc(s.title)}</h3><div id="stars" style="text-align:center"></div><textarea class="in" id="rc" rows="3" placeholder="How was it?">${esc(old?old.comment:'')}</textarea><button class="btn l w" onclick="saveRev('${sid}')">Post Review</button>`);paint()}
const paint=()=>{$('#stars').innerHTML=[1,2,3,4,5].map(n=>`<button class="star" onclick="STAR=${n};paint()">${n<=STAR?'★':'☆'}</button>`).join('')};
async function saveRev(sid){const c=$('#rc').value.trim();if(!c)return toast('Write a short comment 🙏');const s=S.services.find(x=>x.id===sid);
 const p=save('reviews',user.uid+'_'+sid,{serviceId:sid,uid:user.uid,name:user.name,rating:STAR,comment:c,createdAt:Date.now()});
 if(s&&s.ownerUid)addAlert(s.ownerUid,'New review','New '+STAR+'★ review on '+s.title,'review');shut();draw();toast('Thanks for your review ⭐');await p}

/* ========== SELLER: SERVICES (photos + hours), VERIFIED, FEATURED ========== */
function svcForm(id){const s=id?S.services.find(x=>x.id===id):{},cat=s.category||'Beauty',wd=wdays(s);PICS=[...(s.images&&s.images.length?s.images:s.image?[s.image]:[])];
 sheet(`<h3>${id?'Edit':'Add New'} Service</h3><input type="hidden" id="fid" value="${id||''}">
 <input class="in" id="ft" placeholder="Service title e.g. Braids by Ama" value="${esc(s.title||'')}">
 <select class="in" id="fc" onchange="subs()">${Object.keys(D).map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select><select class="in" id="fs"></select>
 <input class="in" id="fp" type="number" min="1" placeholder="Price (GH₵)" value="${s.price||''}">
 <textarea class="in" id="fd" rows="3" placeholder="Description">${esc(s.description||'')}</textarea>
 <label>Working days</label><div class="chips" id="wds">${[1,2,3,4,5,6,0].map(d=>`<span class="chip ${wd.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${DN[d]}</span>`).join('')}</div>
 <div style="display:flex;gap:8px"><div style="flex:1"><label>Opens</label><input class="in" type="time" id="fo" value="${s.openTime||'08:00'}"></div><div style="flex:1"><label>Closes</label><input class="in" type="time" id="fcl" value="${s.closeTime||'18:00'}"></div></div>
 <input class="in" id="fl" placeholder="Location e.g. Amamoma, Cape Coast" value="${esc(s.location||'')}">
 <input type="hidden" id="la" value="${s.locationLat||''}"><input type="hidden" id="lo" value="${s.locationLng||''}">
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="myLoc()">📍 Use My Location</button><button class="btn k sm" onclick="pin()">🗺️ Drop Pin on Map</button></div>
 <p class="m" id="lt">${s.locationLat?`📍 Pin saved: ${s.locationLat}, ${s.locationLng}`:''}</p><div id="pinbox" style="display:none"><div id="pinmap" style="height:220px;border-radius:14px"></div><p class="m">Tap the map to drop your pin</p></div>
 <label>Photos (up to 4)</label><div class="chips" id="pics" style="padding-top:10px"></div>
 <input type="file" id="pf" accept="image/*" multiple hidden onchange="fileSel(this)">
 <button class="btn sm" onclick="$('#pf').click()">📷 Upload from phone</button>
 <div style="display:flex;gap:6px;margin-top:8px"><input class="in" id="pu" style="margin:0" placeholder="…or paste image URL"><button class="btn o sm" onclick="addPic($('#pu').value.trim());$('#pu').value=''">Add</button></div>
 <p class="m" style="margin-top:8px">Or tap a sample photo:</p><div class="chips">${PRE.map(u=>`<img src="${U(u)}" width="60" height="60" alt="" style="border-radius:12px;object-fit:cover;flex:none;cursor:pointer" onclick="addPic(this.src)">`).join('')}</div>
 <button class="btn l w" onclick="saveSvc()">💾 Save Service</button>`);subs(s.subCategory);renderPics()}
const subs=sel=>{$('#fs').innerHTML=Object.keys(D[$('#fc').value]).map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')};
const renderPics=()=>{$('#pics').innerHTML=PICS.map((u,i)=>`<div style="position:relative;flex:none"><img src="${esc(u)}" width="72" height="72" alt="" style="border-radius:12px;object-fit:cover"><button class="x" onclick="PICS.splice(${i},1);renderPics()">×</button></div>`).join('')||'<p class="m">No photos yet – add at least one 📷</p>'};
const addPic=u=>{if(!u)return;if(PICS.length>=4)return toast('Max 4 photos 📷');PICS.push(u);renderPics()};
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});
async function fileSel(inp){for(const f of [...inp.files]){if(PICS.length>=4){toast('Max 4 photos 📷');break}try{PICS.push(await shrink(f))}catch(e){toast('That photo could not be read 😕')}}inp.value='';renderPics()}
const setPin=(a,b)=>{$('#la').value=a.toFixed(6);$('#lo').value=b.toFixed(6);$('#lt').textContent=`📍 Pin saved: ${a.toFixed(5)}, ${b.toFixed(5)}`};
async function myLoc(){toast('Getting your location…');const p=await getPos();if(!p)return toast('Could not get location – drop a pin instead 🗺️');setPin(p.lat,p.lng);if(!$('#fl').value)$('#fl').value='My current location'}
function pin(){const bx=$('#pinbox');bx.style.display='block';
 const init=()=>{if(bx._m)return;const m=L.map('pinmap').setView([+$('#la').value||5.116,+$('#lo').value||-1.2976],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);let mk2;
  const put=(a,b)=>{mk2?mk2.setLatLng([a,b]):mk2=L.marker([a,b]).addTo(m);setPin(a,b)};if($('#la').value)put(+$('#la').value,+$('#lo').value);m.on('click',e=>put(e.latlng.lat,e.latlng.lng));bx._m=m;setTimeout(()=>m.invalidateSize(),250)};
 if(window.L)return init();const c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
 const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=init;s.onerror=()=>toast('Map needs internet – use My Location instead 📍');document.head.appendChild(s)}
async function saveSvc(){const id=$('#fid').value||'svc_'+Date.now().toString(36)+rid(3),old=S.services.find(x=>x.id===id)||{},title=$('#ft').value.trim(),price=+$('#fp').value,
 wd=[...document.querySelectorAll('#wds .chip.on')].map(c=>+c.dataset.d),op=$('#fo').value,cl=$('#fcl').value;
 if(!title||!(price>0))return toast('Add a title and a price 🙏');
 if(!wd.length)return toast('Pick at least one working day 📅');
 if(!op||!cl||toM(op)>=toM(cl))return toast('Closing time must be after opening time 🕒');
 const images=PICS.length?[...PICS]:[U(PRE[0])];if(JSON.stringify(images).length>750000)return toast('Photos are too big – remove one 📷');
 const p=save('services',id,{title,category:$('#fc').value,subCategory:$('#fs').value,price,entrepreneurName:user.name,entrepreneurPhone:user.phone,location:$('#fl').value.trim()||'UCC Campus, Cape Coast',locationLat:+$('#la').value||5.116,locationLng:+$('#lo').value||-1.2976,image:images[0],images,workDays:wd,openTime:op,closeTime:cl,description:$('#fd').value.trim()||'Great campus service. Book your slot today!',verified:!!user.verified||!!old.verified,featured:!!old.featured,featuredExpiresAt:old.featuredExpiresAt||0,ownerUid:user.uid,createdAt:old.createdAt||Date.now()});
 shut();draw();toast('Service saved – live in Explore ✅');await p}
async function delSvc(id){if(!confirm('Delete this service?'))return;draw();await del('services',id);draw();toast('Deleted 🗑️')}
function payVer(){if(user.verified)return toast('You are already Verified ✔');if(S.vr.some(v=>v.uid===user.uid&&v.status==='pending'))return toast('Your verification is already waiting for approval ⏳');
 paySheet('✔ Get Verified – GH₵20',20,'<p class="m">Blue Tick on your profile and all your services. Added after we confirm your payment.</p>',async(tx,ph)=>{
  const p=save('verificationRequests','vr_'+rid(8),{entrepreneur:user.name,uid:user.uid,paidAmount:20,transactionId:tx,phone:ph,status:'pending',createdAt:Date.now()});
  addAlert(user.uid,'Verification pending','Payment received – waiting for admin approval ⏳','payment');shut();draw();toast('Sent! We will approve once payment is confirmed ⏳');await p})}
function payFeat(){const my=S.services.filter(s=>s.ownerUid===user.uid);if(!my.length)return toast('Add a service first, then feature it ⭐');
 paySheet('⭐ Get Featured – GH₵15 / week',15,`<label>Which service?</label><select class="in" id="fsv">${my.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select><p class="m">Shows at the TOP of Home for 7 days after we confirm your payment. Renew anytime.</p>`,async(tx,ph)=>{
  const sid=$('#fsv').value,s=my.find(x=>x.id===sid);
  if(S.fr.some(f=>f.serviceId===sid&&f.status==='pending'))return toast('That service already has a Featured request waiting ⏳');
  const p=save('featuredRequests','fr_'+rid(8),{entrepreneur:user.name,uid:user.uid,serviceId:sid,serviceTitle:s.title,paidAmount:15,transactionId:tx,phone:ph,status:'pending',createdAt:Date.now()});
  addAlert(user.uid,'Featured pending','Payment received for '+s.title+' – waiting for admin approval ⏳','payment');shut();draw();toast('Sent! We will approve once payment is confirmed ⏳');await p})}

/* ========== AI SLOTTY ========== */
const STOP='under below find want need for the and with any you service services show please some dey cheap than less max within gh'.split(' ');
function chat(){sheet(`<h3>✨ Slotty</h3><div id="cm" style="max-height:50vh;overflow:auto">${CH}</div><div style="display:flex;gap:8px;margin-top:8px"><input class="in" id="ci" style="margin:0" placeholder="e.g. braids under 50" onkeydown="if(event.key=='Enter')say()"><button class="btn" onclick="say()">Send</button></div>`);if(!CH)bot("Hi, I'm Slotty! What service you dey find? ✨")}
function bot(t,ids){const c=$('#cm');if(!c)return;c.insertAdjacentHTML('beforeend',`<div class="msg bot">${esc(t)}</div>`+(ids||[]).map(id=>{const s=S.services.find(x=>x.id===id);return `<div class="mc" onclick="shut();go('svc','${id}')"><div class="im">${imgTag(s)}</div><div><div class="t">${esc(s.title)}${tk(s)}</div><div class="pr">GH₵${s.price}</div></div></div>`}).join(''));c.scrollTop=c.scrollHeight;CH=c.innerHTML}
function say(){const i=$('#ci'),q=i.value.trim();if(!q)return;i.value='';$('#cm').insertAdjacentHTML('beforeend',`<div class="msg me">${esc(q)}</div>`);setTimeout(()=>ask(q),300)}
function ask(q){const l=q.toLowerCase();
 if(/^(hi|hello|hey|yo|wassup|hola)\b/.test(l))return bot('Hey! 👋 Tell me the service and your budget, e.g. "nails under 40".');
 if(/featur/.test(l))return bot('To get Featured ⭐: switch to Selling mode → Profile → Get Featured GH₵15/week, pay by MoMo and enter your Transaction ID. After admin confirms, your service shows at the TOP of Home for 7 days. You can renew anytime!');
 if(/verif|blue tick|tick/.test(l))return bot('To get Verified ✔: Profile (Selling mode) → Get Verified GH₵20. After admin confirms your payment you get a Blue Tick on your profile and all your services.');
 if(/install|app/.test(l))return bot('Tap the "Install App" button on Home or Profile. On iPhone use Safari → Share → Add to Home Screen. 📲');
 if(/how.*book|book.*how/.test(l))return bot('How to book 🎟️\n1. Open a service, tap Book Now\n2. Pick a day and a time within the seller\'s working hours\n3. Send the 10% booking fee by MoMo to 0203720887 (Kenneth Tandoh, Ref: SLOTIFY)\n4. Enter Transaction ID + phone, tap I Have Paid\n5. We confirm and you get an alert + Booking ID. Pay the other 90% on arrival.');
 if(/pay|momo|money/.test(l))return bot('Pay with MoMo 💳: send the 10% booking fee to 0203720887, Name: Kenneth Tandoh, Ref: SLOTIFY. Then enter your Transaction ID in the app. The other 90% you pay on arrival.');
 if(/review|rating/.test(l))return bot('After your booking is confirmed, open the service (or Booking tab) and tap Write a review ⭐');
 const m=l.match(/(?:under|below|less than|<|max|within)\s*(?:gh[₵c]?\s*)?(\d+)/),max=m?+m[1]:1e9,w=l.replace(/[^a-z ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!STOP.includes(x)).map(x=>x.replace(/s$/,''));
 if(!w.length&&!m)return bot('Try something like "braids under 50", "phone repair" or "tutor". You can also ask me how to book, pay, get Featured or Verified. ✨');
 const r=S.services.filter(s=>s.price<=max&&(!w.length||w.some(x=>(s.title+' '+s.subCategory+' '+s.category+' '+s.location).toLowerCase().includes(x)))).sort((a,b)=>b.featured-a.featured).slice(0,4);
 r.length?bot(`Chale, I find ${r.length} for you 🔥 Tap one to open:`,r.map(s=>s.id)):bot('Eii, I no see any match 😕 Try another word or a higher budget.')}

/* ========== START ========== */
window.addEventListener('online',()=>refresh().then(()=>{toast('Back online – synced ✅');if(!$('.ov'))draw()}));
window.addEventListener('offline',()=>toast('You are offline – data saved on your phone 📴'));
window.addEventListener('error',()=>toast('Small hiccup – please try again 🙏'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
user?start():welcome();
</script>
